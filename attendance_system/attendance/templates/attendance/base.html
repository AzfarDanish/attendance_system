<!DOCTYPE html>
<html>
<head>
    <title>Attendance System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Attendance System</a>
        <div class="navbar-nav">
            <a class="nav-item nav-link" href="{% url 'qr_check_in' %}">QR Check-In</a>
            {% if user.is_authenticated %}
                <a class="nav-item nav-link" href="{% url 'manual_attendance' %}">Manual Attendance</a>
                <a class="nav-item nav-link" href="/admin/">Admin Dashboard</a>
                <a class="nav-item nav-link" href="/admin/logout/">Logout</a>
            {% else %}
                <a class="nav-item nav-link" href="/admin/login/">Login</a>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
