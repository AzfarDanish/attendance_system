{% extends 'attendance/dashboard_base.html' %}

{% block dashboard_content %}
<div class="container">
    <h2 class="text-center mb-4">QR Check-In</h2>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
        {% endfor %}
    {% endif %}
    <div class="card bg-light p-4 mx-auto" style="max-width: 500px;">
        <div class="text-center mb-3 position-relative">
            <video id="video" width="100%" height="auto" autoplay playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 5px;"></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div id="qr-overlay" style="position: relative; width: 100%; padding-top: 75%; border: 2px solid #6c757d; border-radius: 5px; background: rgba(255, 255, 255, 0.3);">
                <div style="position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; border: 2px dashed #28a745; pointer-events: none;"></div>
                <p id="scanning-text" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #6c757d; font-weight: 500;">Scanning for QR code...</p>
            </div>
        </div>
        <form method="post" id="qr-form">
            {% csrf_token %}
            <input type="hidden" name="student_id" id="student_id">
            <div class="form-group">
                <label for="manual_student_id">Manual Entry (if camera fails)</label>
                <input type="text" name="student_id" id="manual_student_id" class="form-control" placeholder="e.g., S00001">
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-light">
                    <i class="fas fa-qrcode mr-1"></i> Check In Manually
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block additional_js %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
    const video = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvas = canvasElement.getContext('2d');
    const scanningText = document.getElementById('scanning-text');
    const qrOverlay = document.getElementById('qr-overlay');
    const qrForm = document.getElementById('qr-form');
    const studentIdInput = document.getElementById('student_id');

    // Access the camera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
            console.log('Camera access granted');
            video.srcObject = stream;
            video.setAttribute('playsinline', true);
            video.play();
            // Set the video dimensions to match the overlay
            video.addEventListener('loadedmetadata', () => {
                const aspectRatio = video.videoWidth / video.videoHeight;
                const overlayWidth = qrOverlay.offsetWidth;
                qrOverlay.style.height = `${overlayWidth / aspectRatio}px`;
                console.log('Video dimensions:', video.videoWidth, video.videoHeight);
            });
            requestAnimationFrame(tick);
        })
        .catch(err => {
            console.error('Error accessing camera:', err);
            scanningText.textContent = 'Camera access denied. Please use manual entry.';
        });

    function tick() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            // Set canvas dimensions to match video
            canvasElement.height = video.videoHeight;
            canvasElement.width = video.videoWidth;
            // Draw the video frame to the canvas
            canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            // Scan for QR code
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: 'attemptBoth',
            });

            if (code) {
                console.log('QR code detected:', code.data);
                studentIdInput.value = code.data;
                qrForm.submit();
            } else {
                console.log('No QR code detected in this frame');
            }
        } else {
            console.log('Video not ready:', video.readyState);
        }
        requestAnimationFrame(tick);
    }
</script>
{% endblock %}
