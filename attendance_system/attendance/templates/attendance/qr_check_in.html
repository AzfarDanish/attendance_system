{% extends 'attendance/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">QR Code Check-In</h2>
    <div class="row">
        <!-- Webcam Scanning -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title">Scan QR Code</h4>
                    <video id="video" class="img-fluid border rounded" autoplay></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div id="status" class="alert alert-info mt-3" role="alert">
                        Initializing webcam...
                    </div>
                </div>
            </div>
        </div>
        <!-- Manual Check-In -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title">Manual Check-In</h4>
                    <form id="manual-checkin-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="student_id" class="form-label">Student ID</label>
                            <input type="text" id="student_id" name="student_id" class="form-control" placeholder="e.g., S00001" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Check In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const manualForm = document.getElementById('manual-checkin-form');

    // Function to start scanning
    function startScanning() {
        if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0 && video.videoHeight > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            scanQRCode();
        } else {
            setTimeout(startScanning, 100);
        }
    }

    // QR code scanning function
    function scanQRCode() {
        if (video.videoWidth === 0 || video.videoHeight === 0) {
            updateStatus('danger', 'Video feed unavailable. Please check your webcam.');
            return;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        try {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            if (code) {
                checkIn(code.data, true);
            } else {
                requestAnimationFrame(scanQRCode);
            }
        } catch (e) {
            updateStatus('danger', 'Error scanning QR code: ' + e.message);
            setTimeout(() => requestAnimationFrame(scanQRCode), 2000);
        }
    }

    // Function to handle check-in (QR or manual)
    function checkIn(studentId, isQR) {
        updateStatus('info', 'Processing check-in for ' + studentId + '...');
        fetch('/qr-check-in/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ student_id: studentId })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                updateStatus('success', data.message);
                if (isQR) {
                    // Resume scanning after 3 seconds for QR scans
                    setTimeout(() => {
                        updateStatus('info', 'Ready to scan next QR code.');
                        requestAnimationFrame(scanQRCode);
                    }, 3000);
                } else {
                    // Clear manual form
                    manualForm.reset();
                    updateStatus('info', 'Ready for next check-in.');
                }
            } else {
                updateStatus('danger', data.message);
                if (isQR) {
                    // Resume scanning after 3 seconds
                    setTimeout(() => {
                        updateStatus('info', 'Ready to scan next QR code.');
                        requestAnimationFrame(scanQRCode);
                    }, 3000);
                }
            }
        })
        .catch(err => {
            updateStatus('danger', 'Network error: ' + err.message);
            if (isQR) {
                setTimeout(() => {
                    updateStatus('info', 'Ready to scan next QR code.');
                    requestAnimationFrame(scanQRCode);
                }, 3000);
            }
        });
    }

    // Update status with Bootstrap alert classes
    function updateStatus(type, message) {
        status.className = `alert alert-${type} mt-3`;
        status.textContent = message;
    }

    // Access webcam
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            updateStatus('info', 'Webcam ready. Please show a QR code.');
            startScanning();
        })
        .catch(err => {
            updateStatus('danger', 'Cannot access webcam: ' + err.message + '. Use manual check-in.');
            video.style.display = 'none';
        });

    // Manual check-in form submission
    manualForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const studentId = document.getElementById('student_id').value.trim();
        if (studentId) {
            checkIn(studentId, false);
        } else {
            updateStatus('danger', 'Please enter a student ID.');
        }
    });
</script>
{% endblock %}
