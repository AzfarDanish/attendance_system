{% extends 'attendance/dashboard_base.html' %}

{% block dashboard_content %}
<div class="container">
    <h2 class="text-center mb-4">{% if student %}Edit Student{% else %}Add Student{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_id">Student ID</label>
            {{ form.id }}
        </div>
        <div class="form-group">
            <label for="id_name">Name</label>
            {{ form.name }}
        </div>
        <div class="form-group">
            <label for="id_school_class">Class</label>
            {{ form.school_class }}
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-light mr-2">
                <i class="fas fa-save mr-1"></i> Save
            </button>
            <a href="{% url 'student_list' %}" class="btn btn-light">
                <i class="fas fa-times mr-1"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
